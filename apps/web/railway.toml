# Railway Web service — Nixpacks at monorepo root (see DEPLOYMENT.md).
# Settings → Root Directory: blank or "/"
# Settings → Config-as-code path: apps/web/railway.toml
#
# Set NEXT_PUBLIC_API_URL before the first build so Next.js rewrites and the client bundle are correct.

[build]
builder = "NIXPACKS"
# Nixpacks install phase already runs `npm ci`; repeating it causes EBUSY on .cache mounts.
buildCommand = "npm run build --workspace=web"
watchPatterns = [
  "apps/web/**",
  "package.json",
  "package-lock.json",
  "apps/web/next.config.js",
]

[deploy]
startCommand = "npm run start --workspace=web"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
