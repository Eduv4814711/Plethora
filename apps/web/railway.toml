# Railway Web service — Nixpacks at monorepo root (see DEPLOYMENT_RAILWAY.md).
# Settings → Root Directory: blank or "/"
# Settings → Config-as-code path: apps/web/railway.toml
#
# Set NEXT_PUBLIC_API_URL before the first build so browser calls target the API service.

[build]
builder = "NIXPACKS"
# Nixpacks install phase already runs `npm ci`; repeating it causes EBUSY on .cache mounts.
buildCommand = "npm run build --workspace=web"
watchPatterns = [
  "apps/web/**",
  "package.json",
  "package-lock.json",
]

[deploy]
# Run from apps/web so Next finds `.next` and workspace-hoisted deps reliably on Railway.
startCommand = "cd apps/web && npm run start"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
