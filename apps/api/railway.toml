# Railway API service — Railpack at monorepo root (see DEPLOYMENT_RAILWAY.md).
# Settings → Root Directory: blank or "/"
# Settings → Config-as-code path: apps/api/railway.toml

[build]
builder = "RAILPACK"
# Railpack installs the root npm workspace before running this command.
buildCommand = "npm run build --workspace=api"
aptPackages = [
  "chromium",
  "fonts-liberation",
  "libnss3",
  "libatk-bridge2.0-0",
  "libgtk-3-0",
  "libasound2",
  "libxss1"
]
watchPatterns = [
  "apps/api/**",
  "package.json",
  "package-lock.json",
  ".nvmrc",
  ".node-version",
]

[deploy]
# Migrations run in a separate pre-deploy container before Fastify starts.
preDeployCommand = ["cd apps/api && npm run db:migrate:deploy"]
startCommand = "cd apps/api && npm run start:server"
healthcheckPath = "/health/ready"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
drainingSeconds = 30
