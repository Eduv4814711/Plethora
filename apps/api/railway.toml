# Railway API service — Nixpacks at monorepo root (see DEPLOYMENT_RAILWAY.md).
# Settings → Root Directory: blank or "/"
# Settings → Config-as-code path: apps/api/railway.toml

[build]
builder = "NIXPACKS"
# Nixpacks already runs `npm ci` in the install phase; do not repeat it here — a
# second `npm ci` conflicts with Railway's node_modules/.cache mount (EBUSY).
buildCommand = "npm run build --workspace=api"
watchPatterns = [
  "apps/api/**",
  "package.json",
  "package-lock.json",
]

[deploy]
# The start script applies committed Prisma migrations, then starts Fastify.
startCommand = "cd apps/api && npm run start:with-migrate"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
