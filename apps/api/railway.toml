# Railway service config for the Plethora API.
# In the API service (Railway → Settings):
#   - Root Directory: leave at repo root (or "/")
#   - Config-as-code path: apps/api/railway.toml
# The build context is the monorepo root so the workspace lockfile is available.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.api"
# Only redeploy on changes that affect the API image.
watchPatterns = [
  "apps/api/**",
  "Dockerfile.api",
  ".dockerignore",
  "package.json",
  "package-lock.json",
]

[deploy]
# Migrations run in pre-deploy (separate step) so the app can listen before Railway's
# /health probe window. Start is HTTP only — see apps/api/package.json `start:server`.
preDeployCommand = ["npm", "run", "db:migrate:deploy", "--workspace=api"]
startCommand = "npm run start:server --workspace=api"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
