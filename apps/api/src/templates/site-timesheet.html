<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Site timesheet</title>
<style>
  @page { size: A4 landscape; }
  * { box-sizing: border-box; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 7px; color: #1a1518; margin: 0; padding: 0; position: relative;
  }
  .watermark {
    position: fixed; top: 45%; left: 50%;
    transform: translate(-50%, -50%) rotate(-24deg);
    font-size: 70px; font-weight: 800; letter-spacing: 6px;
    color: rgba(0, 0, 0, 0.06); z-index: 0; white-space: nowrap;
  }
  .sheet { position: relative; z-index: 1; }
  header {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 20px; margin-bottom: 10px;
  }
  .issuer-name { font-size: 12px; font-weight: 700; margin: 0 0 2px; }
  .muted { color: #6b6166; }
  .meta { text-align: right; }
  .doc-type { font-size: 15px; font-weight: 800; letter-spacing: 1.5px; margin: 0 0 3px; }
  .logo { max-height: 52px; max-width: 190px; object-fit: contain; margin-bottom: 5px; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  thead { display: table-header-group; }
  th {
    text-align: left; font-size: 6.5px; text-transform: uppercase; letter-spacing: 0.4px;
    padding: 4px 3px; background: #f4f2f3; border-bottom: 1.2px solid #d9d4d6;
  }
  td {
    padding: 3px; border-bottom: 1px solid #eeebec;
    word-wrap: break-word; overflow-wrap: anywhere;
  }
  tr { break-inside: avoid; }
  tbody tr:nth-child(even) td { background: #fbfafa; }
  .empty { color: #6b6166; text-align: center; padding: 12px; font-size: 9px; }
  footer {
    margin-top: 12px; padding-top: 6px; border-top: 1px solid #e5e1e2;
    font-size: 6.5px; color: #6b6166; text-align: center;
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
  (function () {
    var d = window.__SITE_TIMESHEET_DATA__ || {};
    var esc = function (v) {
      return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    };

    var issuer = d.issuer || {};
    var client = d.client || {};
    var columns = d.columns || [];

    var head = columns.map(function (c) { return "<th>" + esc(c) + "</th>"; }).join("");
    var body = (d.rows || []).map(function (row) {
      return "<tr>" + columns.map(function (_, i) {
        return "<td>" + esc(row[i]) + "</td>";
      }).join("") + "</tr>";
    }).join("");

    if (!body) {
      body = '<tr><td colspan="' + columns.length + '" class="empty">' +
        "No timesheet rows captured for this period.</td></tr>";
    }

    document.getElementById("root").innerHTML =
      (d.watermark ? '<div class="watermark">' + esc(d.watermark) + "</div>" : "") +
      '<div class="sheet"><header><div>' +
        (issuer.logoUrl ? '<img class="logo" src="' + esc(issuer.logoUrl) + '" alt="" />' : "") +
        '<div class="issuer-name">' + esc(issuer.legalName || issuer.name) + "</div>" +
        '<div class="muted">' + esc(issuer.address || "") + "</div>" +
      '</div><div class="meta">' +
        '<div class="doc-type">TIMESHEET</div>' +
        "<div><strong>" + esc(d.siteName) + "</strong></div>" +
        "<div>" + esc(d.periodLabel) + "</div>" +
        '<div class="muted">' + esc(client.legalName || client.name || "") + "</div>" +
      "</div></header>" +
      "<table><thead><tr>" + head + "</tr></thead><tbody>" + body + "</tbody></table>" +
      "<footer>Generated " + esc(d.generatedAt) +
        " · Timesheet status: " + esc(d.timesheetStatus) + "</footer></div>";
  })();
</script>
</body>
</html>
