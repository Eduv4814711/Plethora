<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Receipt</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 11px; color: #1a1518; margin: 0; padding: 0;
  }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
  .issuer-name { font-size: 16px; font-weight: 700; margin: 0 0 4px; }
  .muted { color: #6b6166; }
  .meta { text-align: right; }
  .doc-type { font-size: 22px; font-weight: 800; letter-spacing: 2px; margin: 0 0 6px; }
  .logo { max-height: 56px; max-width: 190px; object-fit: contain; margin-bottom: 8px; }
  .party { border: 1px solid #e5e1e2; border-radius: 6px; padding: 10px 12px; margin-top: 22px; }
  .party h2 {
    font-size: 9px; text-transform: uppercase; letter-spacing: 1px;
    margin: 0 0 6px; color: #6b6166; font-weight: 700;
  }
  .amount-box {
    margin-top: 22px; padding: 18px; border: 1.5px solid #1a1518; border-radius: 8px;
    text-align: center; background: #f9f8f8;
  }
  .amount-box .label {
    font-size: 9px; text-transform: uppercase; letter-spacing: 1.4px; color: #6b6166;
  }
  .amount-box .value {
    font-size: 30px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums;
  }
  table { width: 100%; border-collapse: collapse; margin-top: 22px; }
  th {
    text-align: left; font-size: 9px; text-transform: uppercase; letter-spacing: 0.6px;
    padding: 7px 8px; background: #f4f2f3; border-bottom: 1.5px solid #d9d4d6;
  }
  td { padding: 7px 8px; border-bottom: 1px solid #eeebec; }
  .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  footer {
    margin-top: 30px; padding-top: 10px; border-top: 1px solid #e5e1e2;
    font-size: 9px; color: #6b6166; text-align: center;
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
  (function () {
    var d = window.__BILLING_RECEIPT_DATA__ || {};
    var esc = function (v) {
      return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    };
    var money = function (v) { return esc(d.currency || "R") + " " + esc(v == null ? "0.00" : v); };
    var line = function (v) { return v ? "<div>" + esc(v) + "</div>" : ""; };

    var issuer = d.issuer || {};
    var billTo = d.billTo || {};

    document.getElementById("root").innerHTML =
      "<header><div>" +
        (issuer.logoUrl ? '<img class="logo" src="' + esc(issuer.logoUrl) + '" alt="" />' : "") +
        '<div class="issuer-name">' + esc(issuer.legalName || issuer.name) + "</div>" +
        '<div class="muted">' + esc(issuer.address || "") + "</div>" +
        (issuer.vatNumber ? '<div class="muted">VAT: ' + esc(issuer.vatNumber) + "</div>" : "") +
      '</div><div class="meta">' +
        '<div class="doc-type">RECEIPT</div>' +
        "<div><strong>" + esc(d.receiptNumber) + "</strong></div>" +
        "<div>Date: " + esc(d.receiptDate) + "</div>" +
      "</div></header>" +
      '<div class="party"><h2>Received from</h2>' +
        "<div><strong>" + esc(billTo.legalName || billTo.name) + "</strong></div>" +
        line(billTo.address) + line(billTo.email) +
        (billTo.vatNumber ? '<div class="muted">VAT: ' + esc(billTo.vatNumber) + "</div>" : "") +
      "</div>" +
      '<div class="amount-box"><div class="label">Amount received</div>' +
        '<div class="value">' + money(d.amount) + "</div></div>" +
      "<table><thead><tr><th>Detail</th><th class=\"num\">Value</th></tr></thead><tbody>" +
        "<tr><td>Applied to invoice</td><td class=\"num\">" + esc(d.invoiceNumber) + "</td></tr>" +
        (d.paymentMethod ? "<tr><td>Payment method</td><td class=\"num\">" + esc(d.paymentMethod) + "</td></tr>" : "") +
        (d.referenceNumber ? "<tr><td>Reference</td><td class=\"num\">" + esc(d.referenceNumber) + "</td></tr>" : "") +
        "<tr><td>Invoice total</td><td class=\"num\">" + money(d.invoiceTotal) + "</td></tr>" +
        "<tr><td>Total paid to date</td><td class=\"num\">" + money(d.invoicePaid) + "</td></tr>" +
        "<tr><td><strong>Balance outstanding</strong></td><td class=\"num\"><strong>" + money(d.invoiceDue) + "</strong></td></tr>" +
      "</tbody></table>" +
      "<footer>" + (d.issuedBy ? "Issued by " + esc(d.issuedBy) + ". " : "") +
        "This receipt confirms funds received and applied to the invoice above.</footer>";
  })();
</script>
</body>
</html>
