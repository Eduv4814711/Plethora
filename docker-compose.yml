# Plethora ERP — single-VM production stack (Sive.host / Ubuntu 24.04)
#
# Public entrypoint is Caddy only (ports 80/443). web, api, postgres and redis
# are reachable exclusively over the internal `plethora_network` bridge.
#
# Run from the deploy root so the project .env is picked up automatically:
#   cd /opt/plethora
#   docker compose build
#   docker compose up -d
#
# Path/secret configuration comes from /opt/plethora/.env (see
# .env.production.example). The defaults below match the documented VM layout,
# so on the target VM you normally only need to set the secrets.

name: plethora

networks:
  plethora_network:
    driver: bridge

services:
  # ---------------------------------------------------------------------------
  # Reverse proxy — the ONLY service exposed to the public internet.
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: plethora_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${CADDY_CONFIG_DIR:-/opt/plethora/caddy}/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_ROOT:-/opt/plethora/data}/caddy/data:/data
      - ${DATA_ROOT:-/opt/plethora/data}/caddy/config:/config
    depends_on:
      - web
      - api
    networks:
      - plethora_network

  # ---------------------------------------------------------------------------
  # Frontend (Next.js standalone) — internal only, behind Caddy.
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ${REPO_DIR:-/opt/plethora/apps/Plethora}
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in /opt/plethora/.env}
        # Single public domain: the API is served under /api on the same host.
        NEXT_PUBLIC_API_PATH_PREFIX: ${NEXT_PUBLIC_API_PATH_PREFIX:-/api}
    image: plethora-web:latest
    container_name: plethora_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Africa/Johannesburg}
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    expose:
      - "3000"
    depends_on:
      - api
    networks:
      - plethora_network

  # ---------------------------------------------------------------------------
  # Backend API (Fastify + Prisma) — internal only, behind Caddy.
  # Runs `prisma migrate deploy` on start, then serves the compiled server.
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ${REPO_DIR:-/opt/plethora/apps/Plethora}
      dockerfile: apps/api/Dockerfile
    image: plethora-api:latest
    container_name: plethora_api
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-/opt/plethora/.env}
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Africa/Johannesburg}
      HOST: 0.0.0.0
      PORT: "3001"
      # Internal service DNS names on plethora_network. These override anything
      # in the env_file so the API always targets the in-network containers.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      # Local-disk uploads persisted to /opt/plethora/data/uploads via the bind mount.
      STORAGE_DRIVER: local
      UPLOADS_DIR: /app/uploads
      # Caddy terminates TLS and forwards X-Forwarded-* headers.
      TRUST_PROXY: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    volumes:
      - ${DATA_ROOT:-/opt/plethora/data}/uploads:/app/uploads
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - plethora_network

  # ---------------------------------------------------------------------------
  # PostgreSQL — internal only. Data persisted to /opt/plethora/data/postgres.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: plethora_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Africa/Johannesburg}
    volumes:
      - ${DATA_ROOT:-/opt/plethora/data}/postgres:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - plethora_network

  # ---------------------------------------------------------------------------
  # Redis — internal only. Data persisted to /opt/plethora/data/redis.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: plethora_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${DATA_ROOT:-/opt/plethora/data}/redis:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - plethora_network
