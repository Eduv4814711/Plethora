# Deploy Plethora API to Azure App Service (South Africa North)
# Monorepo: apps/api
#
# Setup:
# 1. Add secret AZURE_WEBAPP_PUBLISH_PROFILE (download from Azure Portal → plethora-api → Get publish profile)
# 2. In Azure App Service → Configuration → General settings:
#    Startup Command: cd apps/api && npx prisma generate && npx prisma db push --accept-data-loss && npx prisma db seed && node dist/index.js

name: Deploy Plethora API to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: plethora-api
  NODE_VERSION: '20.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api

      - name: Build API
        run: npm run build
        working-directory: apps/api

      - name: Prepare deployment package
        run: rm -rf .git

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: plethora-api
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: plethora-api

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
