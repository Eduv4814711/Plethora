name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plethora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d plethora_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/plethora_test
      NODE_ENV: test
      JWT_SECRET: ci-test-jwt-secret-minimum-32-characters-long
      JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-min-32-chars
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate and generate
        run: npm run db:generate --workspace=api

      - name: Apply database migrations
        run: npm run db:migrate:deploy --workspace=api

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Test API
        run: npm run test --workspace=api
