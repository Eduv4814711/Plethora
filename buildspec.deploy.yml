version: 0.2

env:
  variables:
    PUPPETEER_SKIP_DOWNLOAD: "true"
    NEXT_PUBLIC_API_URL: "https://api.quickbophasecurity.co.za"
    NEXT_PUBLIC_API_PATH_PREFIX: ""

phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - npm install --global npm@11.17.0
      - apt-get update -y && apt-get install -y postgresql postgresql-contrib
      - service postgresql start
      - su - postgres -c "psql -c \"ALTER USER postgres WITH PASSWORD 'postgres';\""
      - su - postgres -c "createdb plethora_test"
      - npm ci --include=dev
  pre_build:
    commands:
      - echo "Running pre-production verification gate against ephemeral plethora_test DB..."
      - |
        (
          set -euo pipefail
          export CI="true"
          export NODE_ENV="test"
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/plethora_test"
          export TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/plethora_test"
          npm run db:generate
          npm run db:migrate:deploy
          npm run test --workspace=api
          npm run db:audit --workspace=api
          npm run test --workspace=web
        )
      - service postgresql stop || true
      - echo "Building production API and Web artifacts before touching live RDS..."
      - NODE_ENV=production npm run build --workspace=api
      - NODE_ENV=production npm run build --workspace=web
      - (cd infra/aws-cdk && npm ci && npm test && npx cdk synth --quiet)
  build:
    commands:
      - echo "Creating pre-deploy RDS snapshot..."
      - aws rds wait db-instance-available --db-instance-identifier "$DB_INSTANCE_ID" || true
      - SNAP_ID="plethora-predeploy-$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c1-8)-$(date +%Y%m%d%H%M%S)"
      - aws rds create-db-snapshot --db-instance-identifier "$DB_INSTANCE_ID" --db-snapshot-identifier "$SNAP_ID"
      - echo "Resolving DATABASE_URL from Secrets Manager and running Prisma migrations on live RDS..."
      - |
        DB_JSON="$(aws secretsmanager get-secret-value --secret-id "$DB_SECRET_ARN" --query SecretString --output text)"
        DB_HOST="$(echo "$DB_JSON" | jq -r '.host')"
        DB_PORT="$(echo "$DB_JSON" | jq -r '.port // 5432')"
        DB_NAME="$(echo "$DB_JSON" | jq -r '.dbname // "plethora"')"
        DB_USER="$(echo "$DB_JSON" | jq -r '.username')"
        DB_PASS="$(echo "$DB_JSON" | jq -r '.password')"
        export DATABASE_URL="postgresql://${DB_USER}:${DB_PASS}@${DB_HOST}:${DB_PORT}/${DB_NAME}?schema=public&sslmode=require"
        npm run db:migrate:deploy --workspace=api
      - npm prune --omit=dev
      - |
        BUNDLE_KEY="releases/plethora-${CODEBUILD_RESOLVED_SOURCE_VERSION}.zip"
        zip -qry /tmp/plethora-release.zip \
          package.json package-lock.json appspec.yml \
          apps/api/package.json apps/api/dist apps/api/prisma \
          apps/web/package.json apps/web/.next apps/web/public apps/web/next.config.js \
          node_modules infra/ec2/systemd scripts/codedeploy \
          $( [ -d apps/api/node_modules ] && echo apps/api/node_modules ) \
          $( [ -d apps/web/node_modules ] && echo apps/web/node_modules )
        aws s3 cp /tmp/plethora-release.zip "s3://${DEPLOY_BUCKET}/${BUNDLE_KEY}"
  post_build:
    commands:
      - |
        if [ "$CODEBUILD_BUILD_SUCCEEDING" != "1" ]; then
          echo "Skipping CodeDeploy because an earlier phase failed."
          exit 1
        fi
        BUNDLE_KEY="releases/plethora-${CODEBUILD_RESOLVED_SOURCE_VERSION}.zip"
        DEPLOY_ID="$(aws deploy create-deployment \
          --application-name "$CODEDEPLOY_APP" \
          --deployment-group-name "$CODEDEPLOY_GROUP" \
          --s3-location "bucket=${DEPLOY_BUCKET},key=${BUNDLE_KEY},bundleType=zip" \
          --query deploymentId --output text)"
        echo "Started CodeDeploy deployment: $DEPLOY_ID"
        aws deploy wait deployment-successful --deployment-id "$DEPLOY_ID"
        curl -fsS "$API_HEALTH_URL"
        if [ -n "${WEB_HEALTH_URL:-}" ]; then
          curl -fsSI "$WEB_HEALTH_URL" >/dev/null
        fi
