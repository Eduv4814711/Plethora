# Google Cloud Build — build and push Plethora API + Web images.
#
# Prerequisites:
#   - Artifact Registry repository (example: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/plethora)
#   - Secret Manager or substitution for production env at deploy time (not in this file)
#
# Run manually:
#   gcloud builds submit --config=cloudbuild.yaml \
#     --substitutions=_REGION=europe-west1,_API_URL=https://api.example.com
#
# Substitutions (override in trigger or CLI):
#   _REGION          — Artifact Registry region
#   _REPOSITORY      — AR repo name
#   _API_IMAGE       — API image name
#   _WEB_IMAGE       — Web image name
#   _API_URL         — NEXT_PUBLIC_API_URL for web build (public API origin)
#   _API_PATH_PREFIX — optional API path prefix for Next rewrites

substitutions:
  _REGION: europe-west1
  _REPOSITORY: plethora
  _API_IMAGE: api
  _WEB_IMAGE: web
  _API_URL: http://localhost:3001
  _API_PATH_PREFIX: ""

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # ---------------------------------------------------------------------------
  # API image
  # ---------------------------------------------------------------------------
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.api
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_API_IMAGE}:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_API_IMAGE}:latest
      - .

  - id: push-api
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_API_IMAGE}

  # ---------------------------------------------------------------------------
  # Web image (NEXT_PUBLIC_* must be set at build time)
  # ---------------------------------------------------------------------------
  - id: build-web
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.web
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_API_URL}
      - --build-arg
      - NEXT_PUBLIC_API_PATH_PREFIX=${_API_PATH_PREFIX}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_WEB_IMAGE}:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_WEB_IMAGE}:latest
      - .
    waitFor:
      - build-api

  - id: push-web
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_WEB_IMAGE}
    waitFor:
      - build-web

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_API_IMAGE}:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_API_IMAGE}:latest
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_WEB_IMAGE}:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_WEB_IMAGE}:latest

# Optional: add Cloud Run deploy steps after push, e.g.:
#   gcloud run deploy plethora-api --image=... --region=${_REGION} --set-secrets=...
#   gcloud run deploy plethora-web --image=... --region=${_REGION}
